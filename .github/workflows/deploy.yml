# Tự động build và đăng website lên GitHub Pages mỗi khi nhánh main thay đổi
# (kể cả khi bấm "Save" trong trang /admin).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Ưu tiên Bun; nếu GitHub tạm thời không tải được Bun thì build bằng Node/npm
      - uses: oven-sh/setup-bun@v2
        id: bun
        continue-on-error: true

      - uses: actions/setup-node@v4
        if: steps.bun.outcome != 'success'
        with:
          node-version: 22

      - name: Cài thư viện & build
        run: |
          if [ "${{ steps.bun.outcome }}" = "success" ]; then
            bun install --frozen-lockfile
            bun run build
          else
            echo "Bun không khả dụng — dùng npm"
            npm install --legacy-peer-deps --no-audit --no-fund
            npx vite build
          fi

      # Trang 404 = index.html để link trực tiếp không bị lỗi
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
